[project]
name = "habpred"
version = "0.1.0"
description = "High-altitude balloon flight and landing prediction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.61",
    "eccodes>=2.38",
    "eccodeslib>=2.39",
    "requests>=2.32",
    "xarray>=2024.10",
    "h5netcdf>=1.4",
    "h5py>=3.12",
    "sondehub>=0.3.3",
    "shapely>=2.2.0",
    "pyshp>=3.1.9",
    "rasterio>=1.4.4",
    "pyogrio>=0.13.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]

[project.scripts]
habpred = "habpred.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
